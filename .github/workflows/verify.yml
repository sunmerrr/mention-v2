name: Verify Mention
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mention-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify:full
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mention-test-results-${{ github.sha }}
          path: test-results/
          retention-days: 7
  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/deploy/Dockerfile
          target: web
          build-args: BUILD_ID=${{ github.sha }}
          tags: mention-web:${{ github.sha }}
          outputs: type=docker,dest=/tmp/mention-web.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          docker load --input /tmp/mention-web.tar
          docker run --detach --name mention-image-smoke -p 127.0.0.1:8792:8790 mention-web:${{ github.sha }}
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8792/health; then exit 0; fi
            sleep 1
          done
          docker logs mention-image-smoke
          exit 1
      - run: docker stop --time 35 mention-image-smoke
        if: always()
      - run: cd /tmp && sha256sum mention-web.tar > mention-web.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mention-web-${{ github.sha }}
          path: |
            /tmp/mention-web.tar
            /tmp/mention-web.sha256
          retention-days: 30
