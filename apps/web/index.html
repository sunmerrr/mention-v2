<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App</title>
    <meta name="description" content="공통 코어 스켈레톤" />
    <!--
      Runtime config: 컨테이너 entrypoint(또는 S3 배포 스크립트)가 아래 placeholder
      `__APP_RUNTIME_CONFIG__` 를 JSON 으로 치환한다. 그래서 같은 빌드 산출물이 qa/production
      어디서든 돈다. → frontend/build-and-runtime.md
      placeholder 는 유효한 JS 가 아니므로 try/catch 로 감싼다. 치환이 안 된 채 열려도(로컬 dev)
      빈 객체로 동작하고 코드는 import.meta.env 폴백을 탄다.
    -->
    <script>
      try {
        window.__APP_CONFIG__ = __APP_RUNTIME_CONFIG__;
      } catch (_e) {
        window.__APP_CONFIG__ = {};
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
