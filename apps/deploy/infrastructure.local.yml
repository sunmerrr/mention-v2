name: mention-internal-infrastructure
services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - mention-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: "on-failure:3"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  mention-postgres:
