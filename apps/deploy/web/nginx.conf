# SPA 서빙 + 404 하드닝. → deployment/path-and-404-hardening.md, frontend/build-and-runtime.md
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # dotfile 차단 — 단, /.well-known/ 은 통과(ACME 인증서·딥링크·security.txt).
  location ~ /\.(?!well-known) {
    deny all;
  }

  # 해시 자산은 영구 캐시.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # 진입점(index.html)은 항상 fresh — placeholder 치환된 최신 버전을 받도록.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # 확장자 있는 경로는 실제 파일만. 없으면 404 (index.html 로 새지 않음).
  # → /shell.php 같은 임의 경로가 200(홈 HTML)으로 응답하는 사고 방지.
  location ~* \.\w+$ {
    try_files $uri =404;
  }

  # 그 외(무확장 앱 라우트)는 SPA fallback.
  location / {
    try_files $uri /index.html;
  }
}
