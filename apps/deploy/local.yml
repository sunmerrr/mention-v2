name: mention-internal-local
services:
  api:
    image: verify-mention-internal-api:local
    build:
      context: ../..
      dockerfile: apps/deploy/Dockerfile
      target: api
    env_file: ../../.env
    environment:
      APP_ROLE: api
    ports: ["127.0.0.1:14200:4200"]
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
  worker:
    image: verify-mention-internal-api:local
    env_file: ../../.env
    environment:
      APP_ROLE: worker
      PORT: 4201
    stop_grace_period: 35s
